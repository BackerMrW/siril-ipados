name: SirilPad
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SirilPad:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: TestAssets
      - path: Resources
      - path: ../LICENSE.md
        buildPhase: resources
      - path: ../ThirdPartyLicenses
        type: folder
        buildPhase: resources
    dependencies:
      - framework: ../dist/SirilCore.xcframework
        embed: false
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: Siril iPad
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backermrw.sirilpad
        PRODUCT_NAME: SirilPad
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Siril iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "11"
