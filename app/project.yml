name: SirilPad
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SirilPad:
    type: application
    platform: iOS
    sources: [Sources, TestAssets]
    dependencies:
      - framework: ../dist/SirilCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backermrw.sirilpad
        PRODUCT_NAME: SirilPad
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Siril iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
