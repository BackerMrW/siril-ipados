name: Siril iPadOS dependency build and core check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check Apple SDK and compile an arm64 iPadOS test library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          xcodebuild -version > diagnostics/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version > diagnostics/ipados-sdk.txt
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          printf '#import <Foundation/Foundation.h>\nint apple_sdk_probe(void) { return 1; }\n' > "$RUNNER_TEMP/probe.m"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk_path" -c "$RUNNER_TEMP/probe.m" -o "$RUNNER_TEMP/probe.o"
          xcrun --sdk iphoneos ar rcs diagnostics/compiler-probe.a "$RUNNER_TEMP/probe.o"
          file diagnostics/compiler-probe.a > diagnostics/compiler-probe.txt
          xcrun nm diagnostics/compiler-probe.a >> diagnostics/compiler-probe.txt
      - name: Fetch pinned Siril source and verify initial port patch
        shell: bash
        run: |
          set -euo pipefail
          git init siril-src
          cd siril-src
          git remote add origin https://gitlab.com/free-astro/siril.git
          git fetch --depth 1 origin 6c0f8f3207b9cb712f7e04249217123a8ca66915
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD > ../diagnostics/siril-commit.txt
          cat > "$RUNNER_TEMP/siril-ipados.patch" <<'PORT_PATCH'
          diff --git a/meson.build b/meson.build
          index 417eaf8..5dd2661 100644
          --- a/meson.build
          +++ b/meson.build
          @@ -50,6 +50,10 @@ have_fftw3fthreadsnolinkerarg = false
           #   - true  → builds the GTK4 GUI from src/gui-gtk4 (default).
           #   - false → headless CLI-only build (no GTK / GtkSourceView / X11 deps).
           enable_gtk       = get_option('gtk')
          +enable_embedded  = get_option('embedded')
          +if enable_embedded and enable_gtk
          +  error('Embedded builds require -Dgtk=false')
          +endif
           gui_subdir       = 'gui-gtk4'
           if enable_gtk
             add_project_arguments('-DUSE_GTK4=1', language: ['c', 'cpp'])
          @@ -109,6 +113,13 @@ endif
           
           host_cpu_family = host_machine.cpu_family()
           host_os = host_machine.system().to_lower()
          +platform_ios = meson.get_external_property('siril_apple_mobile', false)
          +if platform_ios and (host_os != 'darwin' or not enable_embedded)
          +  error('Apple mobile builds require Darwin cross configuration and -Dembedded=true')
          +endif
          +if platform_ios and (enable_openmp or get_option('arch_native'))
          +  error('Apple mobile baseline requires -Dopenmp=false -Darch_native=false')
          +endif
           message('Host os: ' + host_os)
           
           platform_linux = (
          @@ -192,7 +203,10 @@ elif platform_windows
             siril_cpp_flag += ['-D_WIN32_WINNT=0x0600', '-DWINVER=0x0600']
           elif platform_osx
             # on OSX ObjC and C sources are mixed so adding objc to the linkflags
          -  siril_link_arg += ['-Wl,-framework,Foundation', '-Wl,-framework,AppKit', '-Wl,-framework,Security', '-ObjC']
          +  siril_link_arg += ['-Wl,-framework,Foundation', '-Wl,-framework,Security', '-ObjC']
          +  if not platform_ios
          +    siril_link_arg += '-Wl,-framework,AppKit'
          +  endif
             add_project_arguments('-ObjC', language: [ 'c'])
             add_project_link_arguments(siril_link_arg, language: [ 'c', 'cpp' ])
           else
          @@ -540,6 +554,7 @@ conf_data.set('SIRIL_UNSTABLE', stable ? false : 1)
           conf_data.set('SIRIL_OUTPUT_DEBUG', get_option('buildtype').startswith('debug') ? 1 : false)
           conf_data.set('ENABLE_RELOCATABLE_RESOURCES', relocatable_bundle ? 1 : false)
           conf_data.set('OS_OSX', platform_osx ? 1 : false)
          +conf_data.set('OS_IOS', platform_ios ? 1 : false)
           conf_data.set('HAVE_GTK', enable_gtk ? 1 : false, description : 'Build includes GTK GUI support.')
           conf_data.set('HAVE_X11_DND_FALLBACK', enable_x11_dnd_fallback ? 1 : false, description : 'GTK4 X11 drag-and-drop fallback compiled in (libX11 linked).')
           
          diff --git a/meson_options.txt b/meson_options.txt
          index ef72134..834c615 100644
          --- a/meson_options.txt
          +++ b/meson_options.txt
          @@ -1,4 +1,9 @@
           # Build properties
          +option('embedded',
          +  type: 'boolean',
          +  value: false,
          +  description: 'Build core static libraries without desktop GUI, CLI or test executables'
          +)
           option('gtk',
            type : 'boolean',
            value : true,
          diff --git a/src/core/OS_utils.c b/src/core/OS_utils.c
          index 1886cea..020a2c0 100644
          --- a/src/core/OS_utils.c
          +++ b/src/core/OS_utils.c
          @@ -49,7 +49,11 @@
           #include <sys/param.h>		// define or not BSD macro
           #endif
           #ifdef OS_OSX
          +#ifdef OS_IOS
          +#include <Foundation/Foundation.h>
          +#else
           #include <AppKit/AppKit.h>
          +#endif
           #include <mach/task.h>
           #include <mach/mach_init.h>
           #include <mach/mach_types.h>
          @@ -1161,7 +1165,13 @@ gchar *find_executable_in_path(const char *exe_name, const char *path) {
            * for org.gnome.desktop.interface, which KDE 6 and most GNOME desktops expose
            * via the xdg-desktop-portal; returns FALSE/no-op on other desktops). */
           
          -#ifdef OS_OSX
          +#ifdef OS_IOS
          +/* The embedding UIKit app owns appearance and observes trait changes. */
          +gboolean siril_system_is_dark_mode(void) { return FALSE; }
          +void siril_watch_system_appearance_changes(void (*callback)(gboolean dark)) {
          +	(void)callback;
          +}
          +#elif defined(OS_OSX)
           
           gboolean siril_system_is_dark_mode(void) {
           	NSAppearanceName name = [[NSApp effectiveAppearance]
          @@ -1264,7 +1274,7 @@ void siril_watch_system_appearance_changes(void (*callback)(gboolean dark)) {
           
           #endif /* OS_OSX / _WIN32 / Linux */
           
          -#ifdef OS_OSX
          +#if defined(OS_OSX) && !defined(OS_IOS)
           /* GTK4's GdkMacosView does not override performKeyEquivalent:, unlike GTK3's
            * GdkQuartzView which forwarded Cmd+key events directly to GDK.  As a result,
            * Command+key shortcuts never reach GTK4's shortcut controller.
          @@ -1356,4 +1366,4 @@ gchar *get_siril_version_string() {
           	return g_strdup_printf(_("%s %s for %s (%s)"), PACKAGE, VERSION, SIRIL_BUILD_PLATFORM_FAMILY, CPU_ARCH);
           #endif
           #endif
          -}
          \ No newline at end of file
          +}
          diff --git a/src/meson.build b/src/meson.build
          index 59a7f81..403bd3a 100644
          --- a/src/meson.build
          +++ b/src/meson.build
          @@ -399,6 +399,7 @@ siril_resources = gnome.compile_resources(
             c_name : 'siril_resource')
           
           siril_lib = static_library('siril',
          +                           pic: true,
                                      siril_resources[0], src_files,
                                      dependencies: core_dep,
                                      include_directories: siril_inc_dir,
          @@ -406,6 +407,7 @@ siril_lib = static_library('siril',
                                      cpp_args : siril_cpp_flag)
           
           siril_headless_lib = static_library('siril_headless',
          +                                    pic: true,
                                               'core/headless_stubs.c',
                                               dependencies: core_dep,
                                               include_directories: siril_inc_dir,
          @@ -439,6 +441,7 @@ endif
           # (on-demand stubs for remaining direct GUI calls from core code).
           # gui_iface_impl.c is never linked here.  main-cli.c does not define guiinfo gui.
           
          +if not enable_embedded
           siril_cli = executable('siril-cli', 'main-cli.c', win_res,
                                  dependencies: siril_dep,
                                  link_whole: siril_lib,
          @@ -452,3 +455,4 @@ siril_cli = executable('siril-cli', 'main-cli.c', win_res,
           # Tests
           
           subdir('tests')
          +endif
          PORT_PATCH
          git apply --check "$RUNNER_TEMP/siril-ipados.patch"
          git apply "$RUNNER_TEMP/siril-ipados.patch"
          git diff --check
          git diff > ../diagnostics/siril-ipados.patch
          cp meson.build ../diagnostics/siril-meson.build.txt
          cp meson_options.txt ../diagnostics/siril-meson-options.txt
          printf '%s\n' 'Environment check only. Siril core has NOT been compiled or linked. compiler-probe.a is NOT a Siril library.' > ../diagnostics/STATUS.txt
      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          if ! command -v pkg-config >/dev/null; then brew install pkgconf; fi
          python3 -m venv "$RUNNER_TEMP/siril-build-tools"
          "$RUNNER_TEMP/siril-build-tools/bin/python" -m pip install meson ninja
          echo "$RUNNER_TEMP/siril-build-tools/bin" >> "$GITHUB_PATH"
      - name: Cross-compile CFITSIO for iPadOS arm64
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          stage_dir="$GITHUB_WORKSPACE/ipados-stage"
          git init cfitsio-src
          git -C cfitsio-src remote add origin https://github.com/HEASARC/cfitsio.git
          git -C cfitsio-src fetch --depth 1 origin 1d2f37b1bc8e6d5e8cf8cd497314680322063468
          git -C cfitsio-src checkout --detach FETCH_HEAD
          git -C cfitsio-src rev-parse HEAD > diagnostics/cfitsio-commit.txt
          cmake -S cfitsio-src -B cfitsio-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk_path" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$stage_dir" \
            -DCMAKE_FIND_ROOT_PATH="$sdk_path" \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DBUILD_SHARED_LIBS=OFF -DUSE_CURL=OFF -DUSE_PTHREADS=ON \
            -DTESTS=OFF -DUTILS=OFF -DITERPROGS=OFF \
            -DUSE_SSE2=OFF -DUSE_SSSE3=OFF -DUSE_BZIP2=OFF \
            -DHAVE_SHMEM_SERVICES=OFF 2>&1 | tee diagnostics/cfitsio-configure.log
          cmake --build cfitsio-build --parallel 3 2>&1 | tee diagnostics/cfitsio-build.log
          cmake --install cfitsio-build 2>&1 | tee diagnostics/cfitsio-install.log
          test -f "$stage_dir/lib/libcfitsio.a"
          xcrun lipo -info "$stage_dir/lib/libcfitsio.a" > diagnostics/cfitsio-architecture.txt
          xcrun lipo -verify_arch arm64 "$stage_dir/lib/libcfitsio.a"
          xcrun otool -l "$stage_dir/lib/libcfitsio.a" > diagnostics/cfitsio-platform.txt
          printf '#include <fitsio.h>\nint main(void) { float version; fits_get_version(&version); return 0; }\n' > "$RUNNER_TEMP/fits-link-probe.c"
          xcrun --sdk iphoneos clang -target arm64-apple-ios17.0 -isysroot "$sdk_path" \
            -I"$stage_dir/include" "$RUNNER_TEMP/fits-link-probe.c" \
            "$stage_dir/lib/libcfitsio.a" -lz -lm -lpthread \
            -o diagnostics/fits-link-probe
          xcrun vtool -show-build diagnostics/fits-link-probe > diagnostics/fits-link-probe-platform.txt
          printf '%s\n' 'CFITSIO built and link-checked for iPadOS arm64. No on-device execution yet. Siril core not yet built.' > diagnostics/STATUS.txt
      - name: Attempt real Siril iPadOS core configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          sdk = subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--show-sdk-path'], text=True).strip()
          def tool(name):
              return subprocess.check_output(['xcrun', '--sdk', 'iphoneos', '--find', name], text=True).strip()
          prefix = str(pathlib.Path('ipados-stage').resolve())
          args = ['-target', 'arm64-apple-ios17.0', '-isysroot', sdk]
          pathlib.Path('ipados-cross.ini').write_text(
              '[binaries]\n' +
              '\n'.join(f'{key} = {tool(name)!r}' for key, name in [('c','clang'),('cpp','clang++'),('ar','ar'),('strip','strip')]) +
              "\npkg-config = 'pkg-config'\n" +
              "[host_machine]\nsystem = 'darwin'\ncpu_family = 'aarch64'\ncpu = 'arm64'\nendian = 'little'\n" +
              '[properties]\nneeds_exe_wrapper = true\nsiril_apple_mobile = true\n' +
              f'pkg_config_libdir = {[prefix + "/lib/pkgconfig", prefix + "/share/pkgconfig"]!r}\n' +
              '[built-in options]\n' +
              '\n'.join(f'{key} = {args!r}' for key in ['c_args','cpp_args','c_link_args','cpp_link_args']) + '\n')
          PY
          cp ipados-cross.ini diagnostics/
          # Do not let host macOS pkg-config/CMake metadata satisfy iPadOS dependencies.
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/ipados-stage/lib/pkgconfig:$GITHUB_WORKSPACE/ipados-stage/share/pkgconfig"
          set +e
          meson setup siril-ios-build siril-src --cross-file ipados-cross.ini \
            --wrap-mode=nofallback -Dembedded=true -Dgtk=false \
            -Dopenmp=false -Darch_native=false -Dcriterion=false \
            -Dexiv2=false -Dlibraw=false -Dlibtiff=false -Dlibjpeg=false \
            -Dlibpng=false -Dlibheif=false -DlibXISF=false -Dlibjxl=false \
            -Dlibgit2=false -Dffms2=false -Dffmpeg=false -Dlibcurl=false -Dsqlite=false \
            2>&1 | tee diagnostics/siril-configure.log
          configure_status=${PIPESTATUS[0]}
          set -e
          if test -d siril-ios-build/meson-logs; then cp -R siril-ios-build/meson-logs diagnostics/; fi
          printf '%s\n' "$configure_status" > diagnostics/siril-configure-exit-code.txt
          if test "$configure_status" -ne 0; then
            printf '%s\n' 'CFITSIO built. Siril configuration blocked; see siril-configure.log. Remaining iPadOS libraries are not installed yet.' >> diagnostics/STATUS.txt
            exit "$configure_status"
          fi
          meson compile -C siril-ios-build 2>&1 | tee diagnostics/siril-core-build.log
          printf '%s\n' 'Siril compilation command completed; App integration and device execution remain unverified.' >> diagnostics/STATUS.txt
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siril-ipados-build-diagnostics
          path: |
            diagnostics/
            ipados-stage/
          if-no-files-found: warn
