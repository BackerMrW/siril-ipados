name: Publish native iPad test release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful iphoneos build run ID
        required: true
        type: string
      simulator_run:
        description: Successful simulator regression run ID
        required: true
        type: string
      tag:
        description: Test release tag
        required: true
        default: v0.16.0
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
      SIMULATOR_RUN: ${{ inputs.simulator_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify device build and matching App source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/device-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIMULATOR_RUN" > /tmp/simulator-run.json
          python3 - <<'PY'
          import json, os, re, subprocess
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Invalid version tag"
          run = json.load(open('/tmp/device-run.json'))
          assert run['conclusion'] == 'success', 'Device build did not pass'
          assert run['path'] == '.github/workflows/ipados-preflight.yml', 'Unexpected build workflow'
          revision = run['head_sha']
          subprocess.run(['git', 'fetch', '--depth', '1', 'origin', revision], check=True)
          subprocess.run(['git', 'diff', '--exit-code', revision, 'HEAD', '--', 'app', 'native',
                          'tools/build-ipados-deps.py', 'tools/embed-siril.py', 'tools/package-siril.py',
                          '.github/workflows/ipados-preflight.yml'], check=True)
          simulator = json.load(open('/tmp/simulator-run.json'))
          assert simulator['conclusion'] == 'success', 'Simulator checks did not pass'
          assert simulator['path'] == '.github/workflows/ipados-preflight.yml'
          subprocess.run(['git', 'fetch', '--depth', '1', 'origin', simulator['head_sha']], check=True)
          subprocess.run(['git', 'diff', '--exit-code', simulator['head_sha'], 'HEAD', '--', 'app', 'native',
                          'tools/test-on-simulator.py', 'tools/build-ipados-deps.py', 'tools/embed-siril.py', 'tools/package-siril.py',
                          '.github/workflows/ipados-preflight.yml'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('DEVICE_REVISION=' + revision + '\n')
              env.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Download the verified unsigned App
        uses: actions/download-artifact@v4
        with:
          name: SirilPad-unsigned
          path: release-files
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Collect corresponding sources and validate App metadata
        shell: bash
        run: |
          set -euo pipefail
          mv release-files/SirilPad-unsigned.ipa release-files/SirilPad-${RELEASE_VERSION}-unsigned.ipa
          python3 tools/source-bundle.py --output release-files/SirilPad-${RELEASE_VERSION}-sources.zip
          python3 - <<'PY'
          import json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          root = Path('release-files')
          version = os.environ['RELEASE_VERSION']
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with zipfile.ZipFile(root / ('SirilPad-' + version + '-sources.zip')) as source:
              assert json.loads(source.read('SOURCES.json'))['port_revision'] == revision
          with zipfile.ZipFile(root / ('SirilPad-' + version + '-unsigned.ipa')) as ipa:
              info = plistlib.loads(ipa.read('Payload/SirilPad.app/Info.plist'))
              assert info['CFBundleShortVersionString'] == version
              assert info['CFBundleIdentifier'] == 'com.backermrw.sirilpad'
              assert info.get('UIFileSharingEnabled') is True
              assert info.get('LSSupportsOpeningDocumentsInPlace') is True
              assert 'Payload/SirilPad.app/LICENSE.md' in ipa.namelist()
              assert 'Payload/SirilPad.app/ThirdPartyLicenses/GSL/COPYING' in ipa.namelist()
          (root / 'VALIDATION.txt').write_text(
              'SirilPad ' + version + ' native test release\nPort source: ' + revision +
              '\nDevice App source: ' + os.environ['DEVICE_REVISION'] +
              '\nApp, engine and native build code match the verified device build.\n' +
              'Device build: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['BUILD_RUN'] + '\n' +
              'Simulator checks: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['SIMULATOR_RUN'] + '\n' +
              'Verified: calibrated pixel values, RGGB color reconstruction/RGB round-trip, default star registration/rejection stacking,\n' +
              'background extraction/denoising with star preservation, crop/Asinh/MTF/saturation/rotation, Swift job history/manual MTF and notices.\n' +
              'Original eight statistics and per-CFA filters, selected-region row orientation, histogram bins, pixel reads and full FITS header; native selected-image analysis workspace.\n' +
              'Verified batch deletion/restoration, interrupted restore recovery, permanent gallery/task cleanup, symlink rejection, persistent FITS undo/redo/branch reset, active-task deletion rejection, native image/sequence memory release, and loaded storage/workspace UI.\n' +
              'Advanced batch: exact exposure-scaled calibration with bias removed from darks and lights, single/multiple calibration inputs, persisted settings/input manifests; five stacking methods matched known pixels, seven rejection algorithms reduced a known outlier, real two-pass registration/application, four transforms/six interpolators/output scaling and normalization/weights/quality-filter checks. Loaded calibration/registration/stacking UI captured.\n' +
              'Drizzle: six native kernels with subpixel dithers, actual 2x output, star preservation and independent per-pixel weighted-mean checks; Bayer RGB background levels; generated one/two-pass Bayer pipelines with nonuniform-flat calibration, weight-map delete/restore/permanent cleanup, actual 8/32-bit weight files, old-settings compatibility and actual Drizzle UI capture.\n' +
              'Sequences: original frame reads and quality values, exact changed stack pixels after exclusion, persisted selection/reference undo/redo and branching, interrupted-edit recovery, sequence statistics/CSV, no duplicate inputs on restack, result history and task cleanup; native frame and quality screens captured.\n' +
              'Sequence application: selected-frame seqapplyreg through Swift workspace, unique outputs and preserved old/source FITS, actual scaled dimensions/reference-number remapping/subpixel star alignment, rejection of newly included unmeasured frames, Bayer Drizzle and master-flat snapshot, independent weighted-stack pixel checks, missing-output failure detection, and weight-map restoration/permanent cleanup; application parameter screen captured.\n' +
              'Background editing: independent 625-pixel medians, atomic failed move/restore, stale-model invalidation, restored corrected FITS pixels, persistent parameter/sample undo/redo, canvas drag coordinate conversion/cancellation/bounds, and companion-file trash recovery/cleanup.\n' +
              'Sequence background: exact original per-frame sequence hooks and GUI worker; mono/RGB/Bayer polynomial/RBF/subtract/divide/automatic output pixels, selected frame numbers/reference, preview correspondence, preserved source and earlier results, persisted parameter history, partial-failure rejection/evidence, and task restoration/permanent cleanup; sequence background view captured.\n' +
              'Independent output cleanup: native exact FITS/cache/weight filenames, persistent edit histories, deletion undo/restore/permanent cleanup, source/sibling/stack preservation, interrupted-delete rollback, interrupted-restore completion, conflicts/active-task/source/symlink/traversal protections; live/recoverable output management screen captured.\n' +
              'Sequence result history: persisted real mono/RGB result switching, native Drizzle/background ancestry, duplicate completion/sibling branching, old FITS/index/weight preservation, deleted-output fallback and restored redo, whole-task cursor restoration and active/cross-job/traversal/failed-output rejection; actual result undo workspace captured.\n' +
              'Native tool workbench: 35 original tool workers, independent MTF/negative/SCNR/geometric pixel checks, native 8/16/32-bit mask blending/inversion, inherited and resized masks, stale-preview rejection, persisted edit undo/redo and gallery companion deletion/restore/permanent cleanup. Original PNG/JPEG/TIFF six-format pixel round-trips, orientation, precision, overwrite refusal and malformed-file survival; GHS/mask/filter/geometry workspaces captured.\n' +
              'Original curves: three interpolation modes, seven color spaces, independently checked staged RGB/R transformations, original sigmoid range masks and source-stage pipette/histograms; range previews are excluded from saved image masks. Original PixelMath: independent RGB and per-plane statistics, image variables, expression parameters, mono-to-RGB composition, constant rescaling, syntax/nonfinite/stale-result rejection, settings/script replay, persistent advanced history and native curve/expression UI.\n' +
              'Physical iPad/file-picker/large real-camera datasets still require device testing.\n')
          PY
      - name: Upload and publish the test release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('/tmp/release-notes.md').write_text(
              'Native iPadOS test release using the original pinned Siril engine. Processing runs locally on the iPad.\n\n' +
              '- Curves and PixelMath: original VeraLux seven-channel curves, cubic/linear/Akima interpolation, editable points and ranges, staged application, real histogram/pipette and persisted settings. Original single or R/G/B expressions, up to ten image variables, parameter expressions, rescaling, metadata-sum choice, original function/operator reference and per-image presets. Settings and inputs are retained for replay; failures cannot export stale previews. Sequence/ROI application, global presets and other desktop interaction details remain pending.\n' +
              '- Native tool workbench: 35 original stretch/color/filter/geometry/curve/expression tools with their exposed parameters, original/result/mask display, full-resolution computation, independent result saving and 30-step persisted parameter undo/redo. Edits invalidate previous results. Includes MTF/Asinh/GHS and inverse variants, saturation/SCNR/CCM/unpurple, median/Gaussian/unsharp/CLAHE/banding/bilateral/guided/NLBayes/wavelets, crop/rotations/mirrors/binning/resampling. Additional desktop GUI/ROI/sequence parameters remain pending.\n' +
              '- Original masks: luminance/channel/external-image/color/star generation, autostretch/threshold/blur/feather/invert/strength, real native blending and 8/16/32-bit masks. Saved masks can be reused and resized; mask and tool-history files follow gallery deletion/restoration/permanent cleanup. This workbench has mask parameter undo; interactive mask painting and other desktop mask interactions remain pending.\n' +
              '- Original PNG/JPEG/TIFF import and export: import as independent floating-point FITS; PNG 8/16-bit, JPEG quality, TIFF 8/16/32-bit. Share exports to Files; saved exports can be cleaned with their task. Source files stay intact. Corrupt JPEG decoding returns failure instead of terminating the App. More desktop export settings and RAW/HEIF/JXL/XISF/video remain pending.\n' +
              '- Whole-sequence processing-result undo/redo: registration/Drizzle/background outputs switch actual frames, dimensions and channels. Up to 30 persisted steps, saved-source ancestry, redo branching with old files/weights retained, deletion fallback and restored redo, separate frame-inclusion/reference undo. Background modal switches to its completed output on close; repeated applications from the same input are siblings. Batch stacking undo remains pending.\n' +
              '- Independent sequence output deletion/restoration: native-resolved FITS names and star/mask/Drizzle caches plus edit histories. Undo the last delete, recover from Recently Deleted or permanently clean only that output. Source frames, siblings and saved stack results stay intact. Dependency checks protect later/recoverable outputs; persistent journals roll back interrupted deletion or finish interrupted restoration. Conflicts never overwrite files. Output management screen shows actual availability.\n' +
              '- Sequence background extraction: the original GUI sequence worker with per-frame sampling, RBF/polynomial/automatic models, subtract/divide, dither, randomized dark sampling, gradient descent and border exclusion. Bayer sample models split four sensor subchannels. Exact sequence-hook preview, persisted 30-step parameter undo/redo, independent output sequences and verified included-frame counts; partial failures stay marked as failed. Source and previous outputs are preserved. Original Drizzle weights stay with the source; corrected outputs are ordinary sequences.\n' +
              '- Background sample dragging with original source-pixel median rereads; persistent sample/parameter undo and redo (30 steps), redo-branch reset, coalesced slider and drag edits, and restoration after reopening. Edits invalidate the computed model; rejected border/duplicate edits preserve the samples. History files follow gallery deletion/restoration/permanent cleanup.\n' +
              '- Apply registration directly from a measured sequence: selected frames, six interpolation modes and clamping, four output framings and scale, six Drizzle kernels, pixel fraction, master-flat selection and 8/32-bit weights, plus native quality filters. Open the independently named output sequence to inspect or stack it. Earlier outputs and source frames are retained; delete/restore the complete task from the sequence workspace or task history.\n' +
              '- Native sequence workspace: frame browsing, zoom/display channels, inclusion/exclusion/ranges, reference selection, cross-relaunch selection undo/redo, original registration quality plots/statistics, CSV and restacking into new saved results without copying the inputs again. Interrupted flag edits recover transactionally.\n' +
              '- Advanced calibration: separate CFA/debayer controls, flat CFA equalization and X-Trans repair options, noise/exposure dark optimization and cold/hot master-dark cosmetic correction. A single bias/dark/flat-dark is accepted as a master; one or multiple flats are calibrated. Optimization subtracts bias from darks and lights separately before applying scaled dark current. Camera-specific cosmetic/X-Trans/CFA-equalization outputs still require device validation.\n' +
              '- Global star registration: one/two-pass workflows with real seqapplyreg output, selected reference frame, four transformations, six interpolation modes, clamping, star-pair/star-count/channel/scale parameters and two-pass framing.\n' +
              '- Drizzle / Bayer Drizzle: native one/two-pass workflows, all six kernels, pixel fraction and output scale, optional master-flat initial weights, default 8-bit or matching 32-bit weight files. Keep Bayer mosaics undecoded; the native engine produces RGB. Per-frame drizztmp weights stay with each job through deletion/restoration and are removed by permanent task cleanup. Existing 0.7 settings remain readable.\n' +
              '- Stacking: five methods, seven rejection algorithms, four normalization methods plus none, input/output and fast normalization, RGB equalization, four weighting modes, rejection maps, and FWHM/weighted-FWHM/roundness/background/star-count filters with percentage/absolute/Sigma thresholds. Settings persist; each job saves inputs and generation settings alongside the actual editable script.\n' +
              '- Gallery single/batch deletion, persistent Recently Deleted restoration, permanent deletion/empty trash, and gallery/job/trash storage sizes. Processing tasks can be deleted with their input copies and intermediate files. Imported gallery copies remain independent. Deletion closes original command image/sequence caches and deleting the displayed image clears its preview.\n' +
              '- Full-FITS undo/redo for newly generated single-image processing results, persistent parent links, redo branch reset and adaptive portrait controls. Batch stacking result changes and interactive mask painting do not yet have undo.\n' +
              '- Interactive background extraction: sample placement/dragging/deletion/inspection and persistent edit undo/redo, original RBF/polynomial/automatic models, subtract/divide, original/model/result views and preserved-source FITS export.\n' +
              '- Shared analysis workspace: rectangular selection, original full-resolution pixel reads, original eight statistics with normalized/CFA options, original whole/selected histograms, and full FITS header viewer/search/copy. Keyword and image-metadata editing remain pending.\n' +
              '- Image workspace: pinch zoom and pan, RGB/R/G/B display, linear/automatic display stretch, and an inventory of original tools with explicit incomplete statuses.\n' +
              '- This release does not complete desktop Siril parity. See docs/FUNCTIONAL-PARITY.md for missing parameters, interactions, formats and modules.\n' +
              '- Additional sequence interactions/photometry, PSF/DFT/KOMBAT, distortion/external references, synthetic bias/BPM input controls, overlap normalization/feathering/upscale-at-stacking and other original parameters remain pending.\n' +
              '- Native background extraction, denoising, automatic/Asinh/manual MTF stretch, RGB saturation, crop and rotation.\n' +
              '- Siril scripts, command catalog, logs, cancellation, FITS export and persistent processing history.\n' +
              '- App includes open-source notices; the source ZIP includes the port/build scripts, upstream engine, submodules and dependencies.\n\n' +
              'Install **SirilPad-' + os.environ['RELEASE_VERSION'] + '-unsigned.ipa** from Windows with Sideloadly and your own Apple ID. iPadOS 17 or newer, arm64. ' +
              'Free Apple ID signatures usually last seven days. Keep the App in the foreground while processing.\n\n' +
              'This remains a test release: desktop GTK windows, online catalogs, external executables and some optional formats are not fully ported. ' +
              'Physical iPad and large real-camera datasets need further testing.\n\n' +
              '[Simulator validation](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['SIMULATOR_RUN'] + ') · ' +
              '[Device build](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['BUILD_RUN'] + ')\n')
          PY
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Siril iPad ${RELEASE_VERSION} — native local processing test release" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-files/SirilPad-${RELEASE_VERSION}-unsigned.ipa release-files/SirilPad-${RELEASE_VERSION}-sources.zip release-files/VALIDATION.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" --notes-file /tmp/release-notes.md
