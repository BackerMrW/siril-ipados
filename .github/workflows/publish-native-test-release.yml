name: Publish native iPad test release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful iphoneos build run ID
        required: true
        type: string
      simulator_run:
        description: Successful simulator regression run ID
        required: true
        type: string
      tag:
        description: Test release tag
        required: true
        default: v0.6.0
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN: ${{ inputs.build_run }}
      SIMULATOR_RUN: ${{ inputs.simulator_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify device build and matching App source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/device-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIMULATOR_RUN" > /tmp/simulator-run.json
          python3 - <<'PY'
          import json, os, re, subprocess
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "Invalid version tag"
          run = json.load(open('/tmp/device-run.json'))
          assert run['conclusion'] == 'success', 'Device build did not pass'
          assert run['path'] == '.github/workflows/ipados-preflight.yml', 'Unexpected build workflow'
          revision = run['head_sha']
          subprocess.run(['git', 'fetch', '--depth', '1', 'origin', revision], check=True)
          subprocess.run(['git', 'diff', '--exit-code', revision, 'HEAD', '--', 'app', 'native',
                          'tools/build-ipados-deps.py', 'tools/embed-siril.py', 'tools/package-siril.py',
                          '.github/workflows/ipados-preflight.yml'], check=True)
          simulator = json.load(open('/tmp/simulator-run.json'))
          assert simulator['conclusion'] == 'success', 'Simulator checks did not pass'
          assert simulator['path'] == '.github/workflows/ipados-preflight.yml'
          subprocess.run(['git', 'fetch', '--depth', '1', 'origin', simulator['head_sha']], check=True)
          subprocess.run(['git', 'diff', '--exit-code', simulator['head_sha'], 'HEAD', '--', 'app', 'native',
                          'tools/test-on-simulator.py', 'tools/build-ipados-deps.py', 'tools/embed-siril.py', 'tools/package-siril.py',
                          '.github/workflows/ipados-preflight.yml'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('DEVICE_REVISION=' + revision + '\n')
              env.write('RELEASE_VERSION=' + version + '\n')
          PY
      - name: Download the verified unsigned App
        uses: actions/download-artifact@v4
        with:
          name: SirilPad-unsigned
          path: release-files
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Collect corresponding sources and validate App metadata
        shell: bash
        run: |
          set -euo pipefail
          mv release-files/SirilPad-unsigned.ipa release-files/SirilPad-${RELEASE_VERSION}-unsigned.ipa
          python3 tools/source-bundle.py --output release-files/SirilPad-${RELEASE_VERSION}-sources.zip
          python3 - <<'PY'
          import json, os, plistlib, subprocess, zipfile
          from pathlib import Path
          root = Path('release-files')
          version = os.environ['RELEASE_VERSION']
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with zipfile.ZipFile(root / ('SirilPad-' + version + '-sources.zip')) as source:
              assert json.loads(source.read('SOURCES.json'))['port_revision'] == revision
          with zipfile.ZipFile(root / ('SirilPad-' + version + '-unsigned.ipa')) as ipa:
              info = plistlib.loads(ipa.read('Payload/SirilPad.app/Info.plist'))
              assert info['CFBundleShortVersionString'] == version
              assert info['CFBundleIdentifier'] == 'com.backermrw.sirilpad'
              assert info.get('UIFileSharingEnabled') is True
              assert info.get('LSSupportsOpeningDocumentsInPlace') is True
              assert 'Payload/SirilPad.app/LICENSE.md' in ipa.namelist()
              assert 'Payload/SirilPad.app/ThirdPartyLicenses/GSL/COPYING' in ipa.namelist()
          (root / 'VALIDATION.txt').write_text(
              'SirilPad ' + version + ' native test release\nPort source: ' + revision +
              '\nDevice App source: ' + os.environ['DEVICE_REVISION'] +
              '\nApp, engine and native build code match the verified device build.\n' +
              'Device build: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['BUILD_RUN'] + '\n' +
              'Simulator checks: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['SIMULATOR_RUN'] + '\n' +
              'Verified: calibrated pixel values, RGGB color reconstruction/RGB round-trip, default star registration/rejection stacking,\n' +
              'background extraction/denoising with star preservation, crop/Asinh/MTF/saturation/rotation, Swift job history/manual MTF and notices.\n' +
              'Original eight statistics and per-CFA filters, selected-region row orientation, histogram bins, pixel reads and full FITS header; native selected-image analysis workspace.\n' +
              'Verified batch deletion/restoration, interrupted restore recovery, permanent gallery/task cleanup, symlink rejection, persistent FITS undo/redo/branch reset, active-task deletion rejection, native image/sequence memory release, and loaded storage/workspace UI.\n' +
              'Physical iPad/file-picker/large real-camera datasets still require device testing.\n')
          PY
      - name: Upload and publish the test release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('/tmp/release-notes.md').write_text(
              'Native iPadOS test release using the original pinned Siril engine. Processing runs locally on the iPad.\n\n' +
              '- Gallery single/batch deletion, persistent Recently Deleted restoration, permanent deletion/empty trash, and gallery/job/trash storage sizes. Processing tasks can be deleted with their input copies and intermediate files. Imported gallery copies remain independent. Deletion closes original command image/sequence caches and deleting the displayed image clears its preview.\n' +
              '- Full-FITS undo/redo for newly generated single-image processing results, persistent parent links, redo branch reset and adaptive portrait controls. Batch stacking and sample/parameter edits do not yet have undo.\n' +
              '- Interactive background extraction: sample placement/deletion/inspection, original RBF/polynomial/automatic models, subtract/divide, original/model/result views and preserved-source FITS export.\n' +
              '- Shared analysis workspace: rectangular selection, original full-resolution pixel reads, original eight statistics with normalized/CFA options, original whole/selected histograms, and full FITS header viewer/search/copy. Keyword and image-metadata editing remain pending.\n' +
              '- Image workspace: pinch zoom and pan, RGB/R/G/B display, linear/automatic display stretch, and an inventory of original tools with explicit incomplete statuses.\n' +
              '- This release does not complete desktop Siril parity. See docs/FUNCTIONAL-PARITY.md for missing parameters, interactions, formats and modules.\n' +
              '- Multi-FITS import; light/dark/flat/bias/flat-dark roles; calibration, CFA debayering, star registration and stacking.\n' +
              '- Native background extraction, denoising, automatic/Asinh/manual MTF stretch, RGB saturation, crop and rotation.\n' +
              '- Siril scripts, command catalog, logs, cancellation, FITS export and persistent processing history.\n' +
              '- App includes open-source notices; the source ZIP includes the port/build scripts, upstream engine, submodules and dependencies.\n\n' +
              'Install **SirilPad-' + os.environ['RELEASE_VERSION'] + '-unsigned.ipa** from Windows with Sideloadly and your own Apple ID. iPadOS 17 or newer, arm64. ' +
              'Free Apple ID signatures usually last seven days. Keep the App in the foreground while processing.\n\n' +
              'This remains a test release: desktop GTK windows, online catalogs, external executables and some optional formats are not fully ported. ' +
              'Physical iPad and large real-camera datasets need further testing.\n\n' +
              '[Simulator validation](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['SIMULATOR_RUN'] + ') · ' +
              '[Device build](https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['BUILD_RUN'] + ')\n')
          PY
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "Siril iPad ${RELEASE_VERSION} — native local processing test release" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-files/SirilPad-${RELEASE_VERSION}-unsigned.ipa release-files/SirilPad-${RELEASE_VERSION}-sources.zip release-files/VALIDATION.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "$GITHUB_SHA" --notes-file /tmp/release-notes.md
